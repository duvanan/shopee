# OPS-K2: development only; provisioned secrets stay outside Git.
process.roles=broker,controller
node.id=2
controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
controller.listener.names=CONTROLLER
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
advertised.listeners=INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
listener.security.protocol.map=INTERNAL:SSL,EXTERNAL:SSL,CONTROLLER:SSL
inter.broker.listener.name=INTERNAL
ssl.client.auth=required
listener.name.internal.ssl.client.auth=required
listener.name.external.ssl.client.auth=required
listener.name.controller.ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.3,TLSv1.2
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
auto.create.topics.enable=false
unclean.leader.election.enable=false
default.replication.factor=3
min.insync.replicas=2
num.partitions=6
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
log.dirs=/var/lib/kafka/data/logs
metadata.log.dir=/var/lib/kafka/data/metadata

config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
ssl.keystore.type=PKCS12
ssl.keystore.location=/run/kafka-secrets/keystore.p12
ssl.keystore.password=${file:/run/kafka-secrets/passwords.properties:store.password}
ssl.key.password=${file:/run/kafka-secrets/passwords.properties:store.password}
ssl.truststore.type=PKCS12
ssl.truststore.location=/run/kafka-secrets/truststore.p12
ssl.truststore.password=${file:/run/kafka-secrets/passwords.properties:store.password}
super.users=${file:/run/kafka-secrets/runtime.properties:super.users}
