server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          # Local files override bundled configuration. Both working directories
          # (backend and backend/config-server) resolve backend/config-repo.
          search-locations: classpath:/config-repo,file:./config-repo/,file:../config-repo/
  profiles:
    active: native

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
