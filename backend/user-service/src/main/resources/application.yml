server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopee_user}
    username: ${DB_USER:shopee}
    password: ${DB_PASSWORD:shopee}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

app:
  cookie:
    # true bat buoc HTTPS - de false cho dev local (http://localhost).
    secure: ${COOKIE_SECURE:false}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
