name: Kafka K2 secure static checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.kafka.yml'
      - 'infra/kafka/**'
      - 'tests/infra/kafka/**'
      - 'docs/KAFKA_LOCAL.md'
      - '.github/workflows/kafka-k1.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.kafka.yml'
      - 'infra/kafka/**'
      - 'tests/infra/kafka/**'
      - '.github/workflows/kafka-k1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile bounded AdminClient probe against pinned Kafka client
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/kafka/kafka-clients/4.1.2/kafka-clients-4.1.2.jar --output "$RUNNER_TEMP/kafka-clients-4.1.2.jar"
          mkdir -p "$RUNNER_TEMP/k2-probe"
          javac --release 17 -cp "$RUNNER_TEMP/kafka-clients-4.1.2.jar" -d "$RUNNER_TEMP/k2-probe" infra/kafka/K2Probe.java
      - name: Validate Compose and K2 security policy without starting Kafka
        shell: pwsh
        run: ./infra/kafka/Validate-K2.ps1
      - name: Independent QA checks and negative mutation fixtures
        shell: pwsh
        run: ./tests/infra/kafka/Test-K2.ps1
